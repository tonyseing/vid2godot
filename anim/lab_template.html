<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Fit Lab</title>
<style>
:root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --line: #d9d7d0; --accent: #b0177a; --low: #c2410c; }
@media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe6; --muted: #a09e97; --line: #3a3936; --accent: #f472b6; --low: #fb923c; } }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; }
img { width: 100%; height: auto; border: 1px solid var(--line); image-rendering: pixelated; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
input[type=range] { flex: 1; min-width: 200px; }
.low { color: var(--low); font-weight: 600; }
svg { width: 100%; height: 120px; border: 1px solid var(--line); }
textarea { width: 100%; min-height: 110px; background: transparent; color: var(--fg); border: 1px solid var(--line); }
code, .muted { color: var(--muted); font-size: 13px; }
.paw { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; }
.bar { display: flex; height: 10px; } .bar span { flex: 1; } .bar .on { background: var(--fg); }
</style>
</head>
<body><main>
<h1>Fit lab: <span id="clip"></span></h1>
<p class="muted">Cyan: the video's outline. Magenta: the fitted model. Orange: left legs. Blue: right legs.
Arrow keys step frames. Flagged or low frames are in orange text.</p>
<div class="row"><button id="prev">◀</button><input id="slider" type="range" min="0" value="0"><button id="next">▶</button>
<span>frame <b id="frame"></b> · IoU <b id="iou"></b> <span id="flags" class="low"></span></span></div>
<img id="view" alt="Overlay of the video frame and the fitted model">
<h2>Match per frame</h2><svg id="chart" viewBox="0 0 1000 120" preserveAspectRatio="none"></svg>
<h2>Paw contacts</h2><div id="contacts"></div>
<h2>Motion</h2><div id="motion" class="muted">No facts yet: run <code>facts</code>, then build the lab again.</div>
<h2>Notes</h2>
<div class="row"><button id="note">Add a note for this frame</button><button id="copy">Copy notes</button></div>
<textarea id="notes" placeholder="frame 47: the legs jump back"></textarea>
<p><code id="hashes"></code></p>
</main>
<script>
const DATA = __DATA__;
const $ = (id) => document.getElementById(id);
const frames = DATA.report.frames;
let index = 0;
$("clip").textContent = DATA.clip;
$("slider").max = frames.length - 1;
$("hashes").textContent = Object.entries(DATA.hashes).map(([k, v]) => `${k} ${v.slice(0, 12)}`).join(" · ");
function show(i) {
  index = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[index];
  $("slider").value = index; $("frame").textContent = f.index; $("iou").textContent = f.iou.toFixed(3);
  $("flags").textContent = f.flags.join(", ") + (f.iou < DATA.threshold ? " below threshold" : "");
  $("view").src = `overlays/${String(f.index).padStart(5, "0")}.png`;
}
const width = 1000 / frames.length;
$("chart").innerHTML = `<line x1="0" x2="1000" y1="${120 - DATA.threshold * 110}" y2="${120 - DATA.threshold * 110}" stroke="currentColor" stroke-dasharray="4 4"/>` +
  `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${frames.map((f, i) => `${i * width + width / 2},${120 - f.iou * 110}`).join(" ")}"/>` +
  frames.map((f, i) => (f.flags.length || f.iou < DATA.threshold) ? `<rect x="${i * width}" y="0" width="${width}" height="6" fill="var(--low)"/>` : "").join("");
$("contacts").innerHTML = Object.entries(DATA.timeline).map(([paw, on]) =>
  `<div class="paw"><span>${paw}</span><div class="bar">${on.map((c) => `<span class="${c ? "on" : ""}"></span>`).join("")}</div></div>`).join("");
if (DATA.motion) {
  const m = DATA.motion, c = m.cadence || {}, g = m.gait || {}, k = m.contactCheck || {};
  const row = (name, value) => `<div class="paw"><span>${name}</span><span>${value}</span></div>`;
  const text = (v) => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  $("motion").className = "";
  $("motion").innerHTML = [
    row("Cadence", `video ${c.videoHz} Hz, played ${c.hz} Hz; band ${c.bandHz ? c.bandHz.join("-") + " Hz" : "none"}` +
      ` (${c.massKg ? c.massKg.join("-") + " kg, " + text(c.massSource) : "no mass"})`),
    row("Retime", c.retime === 1 ? "none" : `<b class="low">x${c.retime}</b> (speed and duration scaled)`),
    row("Gait", `brief: ${text(g.expected)}; measured: ${text((g.measured || {}).text)}; reads as ` +
      `${text(((g.measured || {}).reads || []).join(", ") || "none")}` +
      (g.accepted ? `; <b class="low">mismatch accepted: ${text(g.accepted)}</b>` : "")),
    row("Contacts", Object.entries(m.contacts || {}).map(([p, w]) => `${p} ${w[0]}-${w[1]}`).join(" · ")),
    row("Keys check", Object.entries(k.agreement || {}).map(([p, a]) => `${p} ${a}`).join(" · ") +
      (k.gate ? ` (gate ${k.gate})` : "")),
  ].join("");
}
$("slider").oninput = (e) => show(Number(e.target.value));
$("prev").onclick = () => show(index - 1); $("next").onclick = () => show(index + 1);
document.onkeydown = (e) => { if (e.target.id === "notes") return; if (e.key === "ArrowLeft") show(index - 1); if (e.key === "ArrowRight") show(index + 1); };
$("note").onclick = () => { $("notes").value += `${$("notes").value && !$("notes").value.endsWith("\n") ? "\n" : ""}frame ${frames[index].index}: `; $("notes").focus(); };
$("copy").onclick = async () => { try { await navigator.clipboard.writeText($("notes").value); $("copy").textContent = "Copied"; } catch (e) { $("notes").select(); } };
show(0);
</script>
</body></html>
